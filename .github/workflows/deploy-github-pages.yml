name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Déploie automatiquement lors des pushs sur main
  workflow_dispatch:  # Permet un déploiement manuel depuis l'interface GitHub

# Définit les permissions nécessaires pour déployer sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Empêche les déploiements concurrents
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: yelfilal-angular/package-lock.json
      
      - name: Install dependencies
        working-directory: ./yelfilal-angular
        run: npm ci
      
      - name: Build Angular application
        working-directory: ./yelfilal-angular
        run: npm run build:ghpages
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './yelfilal-angular/dist/yelfilal-angular/browser'
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
