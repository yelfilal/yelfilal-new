# ============================================================================
# nginx-security-headers.conf - yelfilal-angular
# En-têtes de sécurité, inclus par nginx.conf au niveau server ET dans chaque
# location qui déclare ses propres add_header : nginx n'hérite des add_header
# du niveau supérieur que si la location n'en déclare aucun.
# ============================================================================

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
