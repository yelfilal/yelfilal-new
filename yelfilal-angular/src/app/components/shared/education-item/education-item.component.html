<article class="card edu-card">
  <span class="edu-card__tile" aria-hidden="true">
    <app-icon name="graduation-cap" [size]="26" />
  </span>

  <div class="edu-card__body">
    <p class="label edu-card__dates">{{ education.startDate }} — {{ education.endDate }}</p>
    <h3 class="edu-card__degree">{{ education.degree }}</h3>
    <p class="edu-card__institution">{{ education.institution }}</p>
    <p class="edu-card__location">{{ education.location }}</p>

    @if (education.distinction) {
      <span class="badge"><app-icon name="star" [size]="12" />{{ education.distinction }}</span>
    }
  </div>
</article>
