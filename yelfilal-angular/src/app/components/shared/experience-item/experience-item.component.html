<div class="rail" aria-hidden="true">
  <span class="rail__dot"></span>
</div>

<div class="entry">
  <article class="card exp-card">
    <p class="label exp-card__dates">{{ experience.startDate }} — {{ experience.endDate }}</p>

    <div class="exp-card__head">
      <h3 class="exp-card__position">{{ experience.position }}</h3>
      <span class="exp-card__type">{{ experience.type }}</span>
    </div>

    <p class="exp-card__company">{{ experience.company }} · {{ experience.location }}</p>

    <ul class="exp-card__list">
      @for (responsibility of experience.responsibilities; track responsibility) {
        <li><span class="diamond" aria-hidden="true"></span><span>{{ responsibility }}</span></li>
      }
    </ul>
  </article>
</div>
