<section class="section" id="experience" aria-labelledby="experience-title">
  <h2 class="section__title" id="experience-title" appScrollAnimation>Expérience professionnelle</h2>

  <ol class="timeline">
    @for (exp of experiences; track exp.company; let i = $index) {
      <li appScrollAnimation [animationDelay]="i * 100">
        <app-experience-item [experience]="exp" />
      </li>
    }
  </ol>
</section>
