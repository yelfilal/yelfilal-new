<!-- Accueil : volontairement sans le nom (il est dans la navigation et le pied de page) -->
<section class="section hero" id="about" aria-labelledby="about-title">
  <div class="hero__text" appScrollAnimation>
    <p class="hero__eyebrow"><span class="hero__dot" aria-hidden="true"></span>{{ personalInfo.title }}</p>

    <h1 class="hero__title" id="about-title">{{ personalInfo.headline.lead }}<span class="hero__highlight">{{ personalInfo.headline.highlight }}</span>{{ personalInfo.headline.trail }}</h1>

    @for (paragraph of personalInfo.intro; track $index) {
      <p class="hero__intro">{{ paragraph }}</p>
    }

    <div class="hero__actions">
      <a class="btn btn--accent hero__cta" href="#experience" (click)="goToExperience($event)">
        Voir mon parcours
        <app-icon name="arrow-right" [size]="18" />
      </a>

      <a class="btn-round hero__social" [href]="'mailto:' + personalInfo.email" [attr.aria-label]="'E-mail : ' + personalInfo.email">
        <app-icon name="mail" [size]="20" />
      </a>

      @for (link of personalInfo.socialLinks; track link.platform) {
        <a class="btn-round hero__social" [href]="link.url" target="_blank" rel="noopener noreferrer" [attr.aria-label]="link.platform">
          <app-icon [name]="link.icon" [size]="link.icon === 'github' ? 22 : 20" />
        </a>
      }
    </div>
  </div>

  <figure class="hero__photo" appScrollAnimation [animationDelay]="120">
    <img [src]="personalInfo.profileImage" [alt]="'Portrait de ' + fullName" width="440" height="440" />
    <figcaption>
      <span>{{ personalInfo.photoCaption.label }}</span>
      <span class="hero__since">{{ personalInfo.photoCaption.since }}</span>
    </figcaption>
  </figure>
</section>
