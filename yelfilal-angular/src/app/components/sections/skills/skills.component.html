<section class="resume-section" id="skills" aria-labelledby="skills-title">
  <div class="resume-section-content">
    <h2 class="mb-5" id="skills-title" appScrollAnimation>Compétences</h2>

    @for (category of skills; track category.category; let i = $index) {
    <div class="mb-4" appScrollAnimation [animationDelay]="i * 100">
      <!-- Nom catégorie si présent -->
      @if (category.category) {
      <div class="subheading mb-3">{{ category.category }}</div>
      }

      <!-- Liste compétences en badges -->
      <div class="skill-badges-container">
        @for (skill of category.skills; track skill) {
        <span class="skill-badge">{{ skill }}</span>
        }
      </div>
    </div>
    }
  </div>
</section>
