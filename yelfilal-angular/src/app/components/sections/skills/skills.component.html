<section class="section" id="skills" aria-labelledby="skills-title">
  <h2 class="section__title" id="skills-title" appScrollAnimation>Compétences</h2>

  <div class="skills-grid">
    @for (category of skills; track category.category; let i = $index) {
      <div class="card skill-card" appScrollAnimation [animationDelay]="(i % 3) * 80">
        <h3 class="skill-card__title">{{ category.category }}</h3>

        <ul class="chips">
          @for (skill of category.skills; track skill) {
            <li class="chip"><span class="chip__dot" aria-hidden="true"></span>{{ skill }}</li>
          }
        </ul>
      </div>
    }
  </div>
</section>
