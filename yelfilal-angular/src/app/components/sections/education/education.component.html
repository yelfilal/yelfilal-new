<section class="section" id="education" aria-labelledby="education-title">
  <h2 class="section__title" id="education-title" appScrollAnimation>Études</h2>

  <div class="edu-list">
    @for (edu of education; track edu.institution; let i = $index) {
      <app-education-item [education]="edu" appScrollAnimation [animationDelay]="i * 100" />
    }
  </div>
</section>
