<section class="resume-section" id="education" aria-labelledby="education-title">
  <div class="resume-section-content">
    <h2 class="mb-5" id="education-title" appScrollAnimation>Formation</h2>

    @for (edu of education; track edu.institution; let i = $index) {
      <div appScrollAnimation [animationDelay]="i * 100">
        <app-education-item [education]="edu"></app-education-item>
      </div>
    }
  </div>
</section>
