<section class="section" id="awards" aria-labelledby="awards-title">
  <h2 class="section__title" id="awards-title" appScrollAnimation>Prix &amp; Certifications</h2>

  <div class="awards-grid">
    @for (award of awards; track award.name; let i = $index) {
      <app-award-item [award]="award" appScrollAnimation [animationDelay]="(i % 3) * 80" />
    }
  </div>
</section>
