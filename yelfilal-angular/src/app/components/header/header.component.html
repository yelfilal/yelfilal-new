<header class="site-header">
  <nav class="nav" aria-label="Navigation principale">
    <a class="brand" href="#about" (click)="navigateToSection('about', $event)">
      <span class="brand__mark" aria-hidden="true">{{ initials }}</span>
      <span class="brand__name"><span class="brand__first">{{ personalInfo.firstName }}</span>&ngsp;<span>{{ personalInfo.lastName }}</span></span>
    </a>

    <ul id="nav-menu" class="nav-links" [class.is-open]="isMenuOpen()">
      @for (link of links; track link.id) {
        <li>
          <a #navLink class="nav-link" [href]="'#' + link.id" (click)="navigateToSection(link.id, $event)">{{ link.label }}</a>
        </li>
      }
    </ul>

    <div class="nav-actions">
      <button type="button" class="btn btn--accent nav-pdf" aria-label="CV en PDF" (click)="exportPdf()">
        <app-icon name="download" [size]="16" />
        <span class="nav-pdf__label">CV en PDF</span>
      </button>

      <button
        type="button"
        class="btn-round theme-btn"
        [attr.aria-label]="themeService.isDark() ? 'Passer en mode clair' : 'Passer en mode sombre'"
        (click)="themeService.toggleTheme()"
      >
        <app-icon [name]="themeService.isDark() ? 'sun' : 'moon'" [size]="18" />
      </button>

      <button
        #menuButton
        type="button"
        class="btn-round menu-btn"
        aria-label="Menu"
        aria-controls="nav-menu"
        [attr.aria-expanded]="isMenuOpen()"
        (click)="toggleMenu()"
      >
        <app-icon name="menu" [size]="20" />
      </button>
    </div>
  </nav>
</header>
