<!-- Theme Toggle Switch ☀️/🌙 -->
<div
  class="theme-toggle"
  role="switch"
  tabindex="0"
  [attr.aria-checked]="themeService.isDark()"
  [attr.aria-label]="themeService.isDark() ? 'Passer en mode clair' : 'Passer en mode sombre'"
  (click)="onToggle($event)"
  (keydown)="onKeydown($event)"
>
  <!-- Icône soleil (Light) -->
  <span class="theme-toggle__icon theme-toggle__icon--light" aria-hidden="true">☀️</span>
  
  <!-- Switch pill -->
  <span class="theme-toggle__track">
    <span class="theme-toggle__thumb" [class.theme-toggle__thumb--dark]="themeService.isDark()"></span>
  </span>
  
  <!-- Icône lune (Dark) -->
  <span class="theme-toggle__icon theme-toggle__icon--dark" aria-hidden="true">🌙</span>
</div>
