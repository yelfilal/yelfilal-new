# ============================================================================
# nginx.conf - yelfilal-angular
# Configuration nginx pour la SPA Angular (image nginx non-root)
# ============================================================================

server {
    # Port non privilégié (nginx tourne sans les droits root)
    listen 8080;
    server_name localhost;

    # Ne pas afficher la version de nginx dans l'en-tête Server
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # En-têtes de sécurité
    # À inclure aussi dans chaque location qui ajoute son propre add_header,
    # sinon ils ne sont pas envoyés (voir nginx-security-headers.conf).
    # -------------------------------------------------------------------------
    include /etc/nginx/snippets/security-headers.conf;

    # -------------------------------------------------------------------------
    # Compression gzip des fichiers texte
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Routage SPA : toute route inconnue renvoie index.html
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # index.html : toujours revalidé, pour que les visiteurs récupèrent les
    # nouveaux noms de bundles après chaque déploiement
    # -------------------------------------------------------------------------
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # -------------------------------------------------------------------------
    # Bundles générés par Angular (main-6YGQ4VUH.js, styles-BU4SIR2C.css...) :
    # le hash du nom change à chaque build, cache d'un an sans risque
    # -------------------------------------------------------------------------
    location ~ "-[A-Z0-9]{8}\.(?:js|css)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Fichiers de public/ (photo, certificats PDF...) : copiés sans hash,
    # cache court pour qu'un fichier remplacé soit visible sous 24 h
    # -------------------------------------------------------------------------
    location ~* \.(?:png|jpe?g|gif|webp|avif|ico|svg|pdf|woff2?|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Pages d'erreur
    # -------------------------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # -------------------------------------------------------------------------
    # Logs (redirigés vers stdout/stderr par l'image)
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
